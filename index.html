<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Drifters</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a1a;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
        }
        canvas { display: block; }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #score-container {
            position: absolute;
            top: 30px;
            left: 30px;
        }
        #score {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            letter-spacing: 4px;
        }
        #combo {
            font-size: 24px;
            color: #ff9933;
            text-shadow: 0 0 15px #ff9933;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #combo.active { opacity: 1; }
        #speed-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 200px;
        }
        #speed-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
        #speed-bar {
            width: 100%;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
        }
        #speed-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff3366);
            transition: width 0.1s;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 14px;
            text-align: center;
            transition: opacity 2s;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            cursor: pointer;
        }
        #start-overlay h1 {
            font-size: 64px;
            color: #00d4ff;
            text-shadow: 0 0 30px #00d4ff;
            margin-bottom: 20px;
        }
        #start-overlay p {
            font-size: 24px;
            color: #ff9933;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .drift-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .drift-indicator.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h1>FREQUENCY DRIFTERS</h1>
        <p>Click to Start</p>
    </div>
    <div id="ui">
        <div id="score-container">
            <div id="score">0</div>
            <div id="combo">1.0x COMBO</div>
        </div>
        <div id="speed-container">
            <div id="speed-label">VELOCITY</div>
            <div id="speed-bar">
                <div id="speed-fill"></div>
            </div>
        </div>
        <div id="controls">WASD or Arrows to move • SPACE to drift</div>
        <div class="drift-indicator" id="drift-indicator">DRIFT!</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
    
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Game state
        let score = 0;
        let combo = 1.0;
        let lastCollectTime = 0;
        let isDrifting = false;
        let gameStarted = false;

        // Ship state
        const shipVelocity = new THREE.Vector3();
        const shipPosition = new THREE.Vector3(0, 0, 0);
        let shipRotation = 0;
        const maxSpeed = 50;
        const acceleration = 30;
        const turnSpeed = 2.5;
        const damping = 0.98;
        const driftDamping = 0.95;

        // Input state
        const keys = {};

        // Collections
        const asteroids = [];
        const notes = [];
        const stars = [];

        // Audio
        let synth, reverb, delay, drone;

        // Note frequencies (pentatonic C4, D4, E4, G4, A4)
        const noteData = [
            { name: 'C', freq: 261.63, color: 0xff3366 },
            { name: 'D', freq: 293.66, color: 0xff9933 },
            { name: 'E', freq: 329.63, color: 0xffff33 },
            { name: 'G', freq: 392.00, color: 0x33ff66 },
            { name: 'A', freq: 440.00, color: 0x3399ff }
        ];

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.2
        );
        composer.addPass(bloomPass);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Create ship
        function createShip() {
            const group = new THREE.Group();
            
            // Main body - elongated octahedron
            const bodyGeom = new THREE.OctahedronGeometry(1.5, 0);
            bodyGeom.scale(1, 0.5, 2);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x00d4ff,
                roughness: 0.3,
                metalness: 0.8,
                emissive: 0x003344,
                emissiveIntensity: 0.5
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            group.add(body);

            // Wings
            const wingGeom = new THREE.BoxGeometry(4, 0.1, 1);
            const wingMat = new THREE.MeshStandardMaterial({
                color: 0x0088aa,
                roughness: 0.4,
                metalness: 0.6
            });
            const wings = new THREE.Mesh(wingGeom, wingMat);
            wings.position.z = -0.5;
            group.add(wings);

            // Engine glow
            const engineGeom = new THREE.SphereGeometry(0.3, 8, 8);
            const engineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const engine = new THREE.Mesh(engineGeom, engineMat);
            engine.position.z = -1.5;
            group.add(engine);

            return group;
        }

        const ship = createShip();
        scene.add(ship);

        // Create star field
        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            
            for (let i = 0; i < 500; i++) {
                positions.push(
                    (Math.random() - 0.5) * 400,
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 400
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });
            
            const starField = new THREE.Points(geometry, material);
            scene.add(starField);
            return starField;
        }

        const starField = createStars();

        // Create asteroid
        function createAsteroid() {
            const size = 1 + Math.random() * 7;
            const geometry = new THREE.IcosahedronGeometry(size, 1);
            
            // Displace vertices for irregular shape
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = positions.getZ(i);
                const noise = 0.8 + Math.random() * 0.4;
                positions.setXYZ(i, x * noise, y * noise, z * noise);
            }
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshStandardMaterial({
                color: 0x444444,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const asteroid = new THREE.Mesh(geometry, material);
            
            // Random lane position
            const lane = Math.floor(Math.random() * 5) - 2;
            asteroid.position.x = lane * 16 + (Math.random() - 0.5) * 10;
            asteroid.position.y = (Math.random() - 0.5) * 10;
            asteroid.position.z = shipPosition.z - 200;
            
            asteroid.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            
            asteroid.userData = {
                rotSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                },
                size: size
            };
            
            scene.add(asteroid);
            asteroids.push(asteroid);
        }

        // Create musical note
        function createNote() {
            const noteInfo = noteData[Math.floor(Math.random() * noteData.length)];
            
            const geometry = new THREE.OctahedronGeometry(0.8, 0);
            const material = new THREE.MeshBasicMaterial({
                color: noteInfo.color,
                transparent: true,
                opacity: 0.9
            });
            
            const note = new THREE.Mesh(geometry, material);
            
            const lane = Math.floor(Math.random() * 5) - 2;
            note.position.x = lane * 16;
            note.position.y = (Math.random() - 0.5) * 8;
            note.position.z = shipPosition.z - 150;
            
            note.userData = {
                noteInfo: noteInfo,
                spawnTime: Date.now(),
                baseY: note.position.y
            };
            
            // Add point light
            const light = new THREE.PointLight(noteInfo.color, 2, 15);
            note.add(light);
            
            scene.add(note);
            notes.push(note);
        }

        // Drift particles
        const driftParticles = [];
        function createDriftParticle() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(100 * 3);
            const colors = new Float32Array(100 * 3);
            
            for (let i = 0; i < 100; i++) {
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = 0;
                
                colors[i * 3] = 0;
                colors[i * 3 + 1] = 1;
                colors[i * 3 + 2] = 1;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.userData = { indices: [] };
            scene.add(particles);
            return particles;
        }

        const driftTrail = createDriftParticle();

        // Audio setup
        async function initAudio() {
            await Tone.start();
            
            reverb = new Tone.Reverb({ decay: 2, wet: 0.3 }).toDestination();
            delay = new Tone.FeedbackDelay('8n', 0.3).toDestination();
            delay.wet.value = 0.2;
            
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'fm' },
                envelope: {
                    attack: 0.02,
                    decay: 0.1,
                    sustain: 0.3,
                    release: 0.5
                }
            }).connect(reverb).connect(delay);
            
            // Background drone
            drone = new Tone.Oscillator(50, 'sine').toDestination();
            drone.volume.value = -20;
            drone.start();
        }

        function playNote(noteInfo) {
            if (synth) {
                synth.triggerAttackRelease(noteInfo.freq, '8n');
            }
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Start game
        document.getElementById('start-overlay').addEventListener('click', async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await initAudio();
            gameStarted = true;
            
            setTimeout(() => {
                document.getElementById('controls').style.opacity = '0';
            }, 5000);
        });

        // Spawn timers
        let lastAsteroidSpawn = 0;
        let lastNoteSpawn = 0;

        // Game loop
        const clock = new THREE.Clock();
        
        function update() {
            if (!gameStarted) return;
            
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            
            // Ship controls
            let accelerating = false;
            let turning = 0;
            
            if (keys['KeyW'] || keys['ArrowUp']) {
                shipVelocity.z -= acceleration * delta;
                accelerating = true;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                shipVelocity.z += acceleration * delta * 0.5;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) turning = 1;
            if (keys['KeyD'] || keys['ArrowRight']) turning = -1;
            
            // Drift
            isDrifting = keys['Space'] && Math.abs(shipVelocity.x) > 8 && turning !== 0;
            
            if (isDrifting) {
                shipVelocity.x *= driftDamping;
                score += 10 * delta * 60;
                document.getElementById('drift-indicator').classList.add('active');
            } else {
                document.getElementById('drift-indicator').classList.remove('active');
            }
            
            // Turning
            shipRotation += turning * turnSpeed * delta;
            ship.rotation.y = shipRotation;
            
            // Apply velocity
            shipVelocity.x += Math.sin(shipRotation) * shipVelocity.z * delta * 0.1;
            
            // Clamp speed
            const speed = shipVelocity.length();
            if (speed > maxSpeed) {
                shipVelocity.multiplyScalar(maxSpeed / speed);
            }
            
            // Apply damping
            shipVelocity.multiplyScalar(isDrifting ? driftDamping : damping);
            
            // Update position
            shipPosition.add(shipVelocity.clone().multiplyScalar(delta));
            
            // Keep in bounds
            shipPosition.x = THREE.MathUtils.clamp(shipPosition.x, -50, 50);
            shipPosition.y = THREE.MathUtils.clamp(shipPosition.y, -20, 20);
            
            ship.position.copy(shipPosition);
            
            // Update camera
            const cameraTarget = new THREE.Vector3(
                shipPosition.x,
                shipPosition.y + 8,
                shipPosition.z + 20
            );
            camera.position.lerp(cameraTarget, 0.05);
            camera.lookAt(shipPosition);
            
            // Spawn asteroids
            if (time - lastAsteroidSpawn > 0.5) {
                const count = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < count; i++) {
                    createAsteroid();
                }
                lastAsteroidSpawn = time;
            }
            
            // Spawn notes
            if (time - lastNoteSpawn > 1.5) {
                createNote();
                lastNoteSpawn = time;
            }
            
            // Update asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                asteroid.rotation.x += asteroid.userData.rotSpeed.x;
                asteroid.rotation.y += asteroid.userData.rotSpeed.y;
                asteroid.rotation.z += asteroid.userData.rotSpeed.z;
                
                // Despawn behind ship
                if (asteroid.position.z > shipPosition.z + 50) {
                    scene.remove(asteroid);
                    asteroids.splice(i, 1);
                }
            }
            
            // Update notes
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                note.rotation.y += 0.02;
                note.rotation.x += 0.01;
                note.position.y = note.userData.baseY + Math.sin(time * 3) * 0.5;
                
                // Check collection
                const dist = shipPosition.distanceTo(note.position);
                if (dist < 3) {
                    // Collect note
                    playNote(note.userData.noteInfo);
                    
                    // Score with combo
                    const comboBonus = isDrifting ? 1 : 0;
                    const points = Math.floor(100 * combo + 100 * comboBonus);
                    score += points;
                    
                    // Update combo
                    const now = Date.now();
                    if (now - lastCollectTime < 3000) {
                        combo = Math.min(10, combo + 0.5);
                    } else {
                        combo = 1;
                    }
                    lastCollectTime = now;
                    
                    // Remove note
                    scene.remove(note);
                    notes.splice(i, 1);
                    continue;
                }
                
                // Despawn after 10 seconds
                if (Date.now() - note.userData.spawnTime > 10000) {
                    scene.remove(note);
                    notes.splice(i, 1);
                }
            }
            
            // Reset combo after 3 seconds
            if (Date.now() - lastCollectTime > 3000) {
                combo = 1;
            }
            
            // Update UI
            document.getElementById('score').textContent = Math.floor(score).toLocaleString();
            document.getElementById('combo').textContent = combo.toFixed(1) + 'x COMBO';
            document.getElementById('combo').classList.toggle('active', combo > 1);
            document.getElementById('speed-fill').style.width = (speed / maxSpeed * 100) + '%';
            
            // Update drift trail
            if (isDrifting && speed > 5) {
                const positions = driftTrail.geometry.attributes.position.array;
                for (let i = 99; i > 0; i--) {
                    positions[i * 3] = positions[(i - 1) * 3];
                    positions[i * 3 + 1] = positions[(i - 1) * 3 + 1];
                    positions[i * 3 + 2] = positions[(i - 1) * 3 + 2];
                }
                positions[0] = shipPosition.x + (Math.random() - 0.5) * 2;
                positions[1] = shipPosition.y + (Math.random() - 0.5) * 2;
                positions[2] = shipPosition.z + 1.5;
                driftTrail.geometry.attributes.position.needsUpdate = true;
                driftTrail.visible = true;
            } else {
                driftTrail.visible = false;
            }
            
            // Update star field position (infinite scrolling effect)
            starField.position.z = shipPosition.z;
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            composer.render();
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
